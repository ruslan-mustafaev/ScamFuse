<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScamFuse Demo Bank — Sign in</title>
    <style>
      body { margin: 0; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #eef2f6; color: #101828; }
      .banner { background: #fffaeb; color: #93370d; padding: 10px 16px; text-align: center; font-weight: 600; font-size: 15px; }
      .box { max-width: 420px; margin: 48px auto; background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
      h1 { font-size: 22px; margin: 0 0 6px; }
      .alert { background: #fef3f2; color: #b42318; padding: 10px 12px; border-radius: 8px; margin: 12px 0; }
      label { display: block; margin: 12px 0 4px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; font: inherit; }
      button { margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 8px; background: #0b4f9c; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="banner" id="banner">Safe demo by ScamFuse: an imitation of a fake bank login. Do not type real passwords.</div>
    <div class="box">
      <h1 id="title">ScamFuse Demo Bank</h1>
      <p id="sub">Online banking</p>
      <div class="alert" id="warn">Unusual activity: your account has been limited. Verify your account to restore access.</div>
      <form id="login" onsubmit="return false">
        <label for="user" id="user-label">Client number</label>
        <input id="user" autocomplete="off" />
        <label for="password" id="password-label">Password</label>
        <input id="password" type="password" autocomplete="off" />
        <button type="submit" id="submit">Sign in to ScamFuse Demo Bank</button>
      </form>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var lang = params.get('lang') || ((navigator.language || 'en').slice(0, 2) === 'ru' ? 'ru' : 'en');
        if (lang !== 'ru') return;
        document.documentElement.lang = 'ru';
        document.title = 'ScamFuse Demo Bank — вход';
        document.getElementById('banner').textContent = 'Безопасная демонстрация ScamFuse: имитация поддельной страницы банка. Не вводите настоящие пароли.';
        document.getElementById('sub').textContent = 'Интернет-банк';
        document.getElementById('warn').textContent = 'Необычная активность: ваш аккаунт заблокирован. Подтвердите личность, чтобы восстановить доступ.';
        document.getElementById('user-label').textContent = 'Номер клиента';
        document.getElementById('password-label').textContent = 'Пароль';
        document.getElementById('submit').textContent = 'Войти в ScamFuse Demo Bank';
      })();
    </script>
  </body>
</html>
