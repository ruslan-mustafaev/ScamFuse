<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Security check</title>
    <style>
      body { margin: 0; font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f3f4f6; color: #111827; }
      .banner { background: #fffaeb; color: #93370d; padding: 10px 16px; text-align: center; font-weight: 600; font-size: 15px; }
      .box { max-width: 460px; margin: 60px auto; background: #fff; border: 1px solid #d1d5db; border-radius: 10px; padding: 28px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      .check { display: flex; align-items: center; gap: 12px; margin: 20px 0; padding: 14px; border: 1px solid #d1d5db; border-radius: 8px; cursor: pointer; user-select: none; }
      .check input { width: 26px; height: 26px; }
      #steps { display: none; background: #eff6ff; border-radius: 8px; padding: 14px 18px; }
      #steps ol { margin: 6px 0 0; padding-left: 20px; }
      kbd { background: #e5e7eb; border-radius: 4px; padding: 1px 6px; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="banner" id="banner">Safe demo by ScamFuse. Do not paste anything anywhere: this is a training page.</div>
    <div class="box">
      <h1 id="title">Verify you are human</h1>
      <p id="text">Complete the security check to continue.</p>
      <label class="check"><input type="checkbox" id="robot" /> <span id="robot-label">I'm not a robot</span></label>
      <div id="steps">
        <strong id="steps-title">Verification steps</strong>
        <ol>
          <li id="s1">Press <kbd>Windows</kbd> + <kbd>R</kbd></li>
          <li id="s2">Press <kbd>Ctrl</kbd> + <kbd>V</kbd></li>
          <li id="s3">Press <kbd>Enter</kbd></li>
        </ol>
      </div>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var lang = params.get('lang') || ((navigator.language || 'en').slice(0, 2) === 'ru' ? 'ru' : 'en');
        if (lang === 'ru') {
          document.documentElement.lang = 'ru';
          document.title = 'Проверка безопасности';
          document.getElementById('banner').textContent = 'Безопасная демонстрация ScamFuse. Ничего никуда не вставляйте: это учебная страница.';
          document.getElementById('title').textContent = 'Подтвердите, что вы человек';
          document.getElementById('text').textContent = 'Пройдите проверку безопасности, чтобы продолжить.';
          document.getElementById('robot-label').textContent = 'Я не робот';
          document.getElementById('steps-title').textContent = 'Шаги проверки';
          document.getElementById('s1').innerHTML = 'Нажмите <kbd>Windows</kbd> + <kbd>R</kbd>';
          document.getElementById('s2').innerHTML = 'Нажмите <kbd>Ctrl</kbd> + <kbd>V</kbd>';
          document.getElementById('s3').innerHTML = 'Нажмите <kbd>Enter</kbd>';
        }

        // Harmless on purpose: if someone runs it, PowerShell only prints a sentence in a hidden window.
        // It is shaped like a real attack so that ScamFuse recognises it.
        var command =
          "powershell -w hidden -c \"Write-Output 'ScamFuse demo: a real attack would run here.'\" " +
          '# I am not a robot - Verification ID 4821';

        function copyWithTextarea(text) {
          var area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.left = '-9999px';
          document.body.appendChild(area);
          area.select();
          document.execCommand('copy');
          area.remove();
        }

        document.getElementById('robot').addEventListener('change', function () {
          document.getElementById('steps').style.display = 'block';
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(command).catch(function () { copyWithTextarea(command); });
          } else {
            copyWithTextarea(command);
          }
        });
      })();
    </script>
  </body>
</html>
