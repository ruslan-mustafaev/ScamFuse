name: Deploy relay

# Publishes relay/ to Cloudflare Workers (free plan). Run by hand from the Actions tab.
# Needs the secrets listed in relay/README.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      WRANGLER: wrangler@4.158.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Telegram accepts only these characters in the webhook secret.
          secret_format='^[A-Za-z0-9_-]{16,256}$'
          if [[ ! $TELEGRAM_WEBHOOK_SECRET =~ $secret_format ]]; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET must be 16-256 characters: Latin letters, digits, _ or - (no spaces)"
            exit 1
          fi
          # A bot token from @BotFather: digits, a colon, then letters. No spaces or line breaks.
          token_format='^[0-9]{5,}:[A-Za-z0-9_-]{30,}$'
          if [[ ! $TELEGRAM_BOT_TOKEN =~ $token_format ]]; then
            echo "::error::TELEGRAM_BOT_TOKEN does not look like a bot token. Copy it again from @BotFather, without spaces."
            exit 1
          fi
          # Ask Telegram once whether it knows the token. Only a clear "no" stops the deploy;
          # no answer or "slow down" is just a warning (extra calls would only add to the rate limit).
          me="$(curl -4 -sS -m 30 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" || true)"
          if [[ $me == *'"ok":true'* ]]; then
            # The bot's username comes from Telegram itself, so a new bot needs no config change.
            username="$(printf '%s' "$me" | grep -o '"username":"[^"]*"' | cut -d'"' -f4)"
            username_format='^[A-Za-z0-9_]{5,32}$'
            if [[ $username =~ $username_format ]]; then
              echo "BOT_USERNAME=$username" >> "$GITHUB_ENV"
            fi
            echo "Telegram bot: @$username"
          elif [[ $me == *'Too Many Requests'* ]]; then
            # Telegram rate-limits only bots it knows, so the token itself is fine.
            echo "::warning::Telegram asks to slow down (the token is valid); continuing."
          elif [[ $me == *'"ok":false'* ]]; then
            reason="$(printf '%s' "$me" | grep -o '"description":"[^"]*"')"
            echo "::error::Telegram refused TELEGRAM_BOT_TOKEN ($reason). After /revoke in @BotFather, store the new token."
            exit 1
          else
            echo "::warning::Telegram did not answer from this runner; the token is checked again when Telegram is connected."
          fi

      - name: Apply database migrations
        run: npx -y "$WRANGLER" d1 migrations apply scamfuse --remote

      - name: Publish the Worker
        run: |
          set -o pipefail
          args=()
          if [ -n "${BOT_USERNAME:-}" ]; then
            args+=(--var "BOT_USERNAME:$BOT_USERNAME")
            echo "Bot username from Telegram: @$BOT_USERNAME"
          fi
          npx -y "$WRANGLER" deploy "${args[@]}" | tee deploy.log

      # After the first publish, so the Worker already exists.
      - name: Store the Telegram secrets
        run: |
          node -e 'process.stdout.write(JSON.stringify({
            TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
            TELEGRAM_WEBHOOK_SECRET: process.env.TELEGRAM_WEBHOOK_SECRET,
          }))' | npx -y "$WRANGLER" secret bulk

      # Same as opening /setup?key=<webhook secret>: registers the webhook, bot commands and descriptions.
      - name: Connect Telegram
        run: |
          url="$(grep -oE 'https://scamfuse-relay\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::Worker address not found in the deploy output"
            exit 1
          fi
          # 403: the new secrets have not reached the Worker yet (seconds).
          # "retry after N": Telegram's rate limit, wait as long as it asks.
          # Anything else (e.g. a brand-new workers.dev name Telegram cannot resolve yet): wait too.
          # At least a minute between Telegram calls, so the retries never feed the rate limit.
          for attempt in 1 2 3 4 5 6; do
            rm -f setup.json
            status="$(curl -sS -m 60 -o setup.json -w '%{http_code}' --get --data-urlencode "key=$TELEGRAM_WEBHOOK_SECRET" "$url/setup" || true)"
            if [ "$status" = "200" ] && grep -q '"ok":true' setup.json; then
              echo "Telegram connected: $(cat setup.json)"
              exit 0
            fi
            retry="$(grep -oE 'retry after [0-9]+' setup.json 2>/dev/null | grep -oE '[0-9]+' || true)"
            if [ "$status" = "403" ]; then
              wait=5
            elif [ -n "$retry" ]; then
              wait=$(( retry + 2 ))
              [ "$wait" -lt 60 ] && wait=60
            else
              wait=60
            fi
            [ "$wait" -gt 180 ] && wait=180
            echo "Attempt $attempt: HTTP $status $(cat setup.json 2>/dev/null) - next try in ${wait}s"
            sleep "$wait"
          done
          echo "::error::Telegram did not accept the webhook (reason above, after \"telegram\"). If it says Unauthorized, store the new token from @BotFather in TELEGRAM_BOT_TOKEN."
          exit 1
