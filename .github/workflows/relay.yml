name: Deploy relay

# Publishes relay/ to Cloudflare Workers (free plan). Run by hand from the Actions tab.
# Needs the secrets listed in relay/README.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
      WRANGLER: wrangler@4.158.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN TELEGRAM_WEBHOOK_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          # Telegram accepts only these characters in the webhook secret.
          if ! printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | grep -Eq '^[A-Za-z0-9_-]{16,256}$'; then
            echo "::error::TELEGRAM_WEBHOOK_SECRET must be 16-256 characters: Latin letters, digits, _ or -"
            exit 1
          fi

      - name: Apply database migrations
        run: npx -y "$WRANGLER" d1 migrations apply scamfuse --remote

      - name: Publish the Worker
        run: |
          set -o pipefail
          npx -y "$WRANGLER" deploy | tee deploy.log

      # After the first publish, so the Worker already exists.
      - name: Store the Telegram secrets
        run: |
          node -e 'process.stdout.write(JSON.stringify({
            TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
            TELEGRAM_WEBHOOK_SECRET: process.env.TELEGRAM_WEBHOOK_SECRET,
          }))' | npx -y "$WRANGLER" secret bulk

      # Same as opening /setup?key=<webhook secret>: registers the webhook, bot commands and descriptions.
      - name: Connect Telegram
        run: |
          url="$(grep -oE 'https://scamfuse-relay\.[a-z0-9-]+\.workers\.dev' deploy.log | head -n 1)"
          if [ -z "$url" ]; then
            echo "::error::Worker address not found in the deploy output"
            exit 1
          fi
          # New secrets can take a few seconds to reach the Worker.
          for attempt in 1 2 3 4 5 6 7 8; do
            status="$(curl -sS -m 30 -o setup.json -w '%{http_code}' --get --data-urlencode "key=$TELEGRAM_WEBHOOK_SECRET" "$url/setup" || true)"
            if [ "$status" = "200" ] && grep -q '"ok":true' setup.json; then
              echo "Telegram connected: $(cat setup.json)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $status $(cat setup.json 2>/dev/null)"
            sleep 5
          done
          echo "::error::Telegram did not accept the webhook. Check TELEGRAM_BOT_TOKEN (after /revoke, store the new token)."
          exit 1
