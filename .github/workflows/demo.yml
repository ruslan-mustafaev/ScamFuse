name: Deploy demo

# Publishes demo/ as a static site on Cloudflare Workers (free plan), using the same
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets as the relay.

on:
  push:
    branches: [main]
    paths: ['demo/**', 'demo.wrangler.toml', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish the demo site
        run: npx -y wrangler@4.158.0 deploy --config demo.wrangler.toml
